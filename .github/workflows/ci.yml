name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Regenerate Sanity types from the schema + GROQ queries; the typecheck
      # then fails if the committed types have drifted from the code.
      - name: Typegen
        run: npm run typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      # §5.9 — unit + component tests with the ≥80% src/lib coverage gate.
      - name: Unit tests (with coverage gate)
        run: npm run test:coverage
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      # SPEC §5.9 — the JS budget is a gate, not a warning. Threshold is
      # 115 KB gzip on the article route, of which the App Router framework
      # floor is ~100 KB. See docs/PHASE-0-NOTES.md for why this differs from
      # the spec's 90 KB.
      #
      # Measured from app-build-manifest.json: the union of JS files the root
      # layout and the article route actually load. Globbing .next/static/chunks
      # would also count polyfills.js (legacy browsers only) and the pages-router
      # runtime Next emits for its built-in /_error — neither ships to readers.
      - name: JS budget
        run: |
          node -e '
          const { gzipSync } = require("zlib");
          const fs = require("fs");
          const m = require("./.next/app-build-manifest.json");
          const route = "/writing/[slug]/page";
          const files = new Set(
            [...(m.pages["/layout"] ?? []), ...m.pages[route]].filter((f) => f.endsWith(".js")),
          );
          let total = 0;
          for (const f of files) total += gzipSync(fs.readFileSync(".next/" + f), { level: 9 }).length;
          const kb = (total / 1024).toFixed(1);
          console.log(`Article route JS: ${kb} KB gzip (${files.size} files)`);
          if (total > 115 * 1024) {
            console.log(`::error::JS budget exceeded: ${kb} KB > 115 KB`);
            process.exit(1);
          }
          '

  # §5.9 — Playwright (chromium in CI; webkit + mobile run locally/pre-deploy)
  # and axe on every reachable template. Content-dependent specs skip
  # themselves when no Sanity dataset is configured.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Playwright + axe
        run: npx playwright test --project=chromium
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # §5.9 — Lighthouse CI on the audited routes. continue-on-error until real
  # content lands (scores on empty states are not the launch scores); flip to
  # blocking as part of the §9 launch checklist.
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Lighthouse CI
        run: npx lhci autorun
